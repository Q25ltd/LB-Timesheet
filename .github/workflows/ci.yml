name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/lb_timesheet_test
      JWT_SECRET: 3e7a1f9c4b8d2e6a0c5f3b7d9e1a4c8f2b6d0e5a9c3f7b1d4e8a2c6f0b5d9e3a
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: lb_timesheet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            mobile/package-lock.json
            web/package-lock.json

      # All four workspaces. eslint and knip live at the root; installing only
      # api is what made run #1 fail with "Unlisted binaries". Mobile and web
      # are installed for the same reason -- `npm run check` typechecks,
      # tests (and for web, builds) them, and root eslint lints them.
      - name: Install (root)
        run: npm ci

      - name: Install (api)
        run: npm ci --prefix api

      - name: Install (mobile)
        run: npm ci --prefix mobile

      - name: Install (web)
        run: npm ci --prefix web

      # Deliberately ONE command, identical to what a developer runs locally:
      # generate -> typecheck -> eslint (all workspaces) -> check-rules ->
      # prisma validate -> knip -> api unit tests -> mobile typecheck ->
      # mobile tests -> web typecheck -> web tests -> web build -> db
      # integrity tests. The db step provisions its own
      # clean database from DATABASE_URL's server and applies REAL migrations
      # with `prisma migrate deploy` — never `db push`. Adding a gate to
      # `npm run check` adds it to CI automatically; do not re-list steps here.
      - name: Check
        run: npm run check

  # Real-browser tests of the account flows (owner decision B8). A separate
  # job, so the authoritative gate above (`npm run check`) gains no
  # dependency on a browser download. It needs only what the gate needs —
  # a Postgres service — plus Playwright's Chromium.
  e2e:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/lb_timesheet_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: lb_timesheet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install (api)
        run: npm ci --prefix api

      - name: Install (web)
        run: npm ci --prefix web

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e --prefix web
