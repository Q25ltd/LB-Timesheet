name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/lb_timesheet_test
      JWT_SECRET: ci-secret-at-least-thirty-two-characters-long
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: lb_timesheet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      # Both workspaces. eslint and knip live at the root; installing only api
      # is what made run #1 fail with "Unlisted binaries".
      - name: Install (root)
        run: npm ci

      - name: Install (api)
        run: npm ci --prefix api

      - name: Push schema
        run: npm run db:push --prefix api

      # Deliberately ONE command, identical to what a developer runs locally:
      # typecheck -> eslint -> check-rules -> prisma validate -> knip -> tests.
      # Adding a gate to `npm run check` adds it to CI automatically, so the two
      # can never drift. Do not re-list the steps individually here.
      - name: Check
        run: npm run check
